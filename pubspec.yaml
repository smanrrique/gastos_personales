name: gastos_personales
description: "Aplicación de finanzas personales con Clean Architecture, 100% local."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # ──────────────────────────────────────────────
  # State management — Riverpod
  # ──────────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ──────────────────────────────────────────────
  # Routing
  # ──────────────────────────────────────────────
  go_router: ^14.6.2

  # ──────────────────────────────────────────────
  # Dependency Injection
  # ──────────────────────────────────────────────
  get_it: ^8.0.3

  # ──────────────────────────────────────────────
  # Persistencia local
  # ──────────────────────────────────────────────
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # ──────────────────────────────────────────────
  # Modelado de datos
  # ──────────────────────────────────────────────
  equatable: ^2.0.7

  # ──────────────────────────────────────────────
  # Manejo funcional de errores
  # ──────────────────────────────────────────────
  dartz: ^0.10.1

  # ──────────────────────────────────────────────
  # Charts / estadísticas
  # ──────────────────────────────────────────────
  fl_chart: ^0.69.2

  # ──────────────────────────────────────────────
  # Notificaciones locales (alertas)
  # ──────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # ──────────────────────────────────────────────
  # Utilidades
  # ──────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ──────────────────────────────────────────────
  # Code generation
  # ──────────────────────────────────────────────
  build_runner: ^2.4.13
  hive_ce_generator: ^1.8.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  # fonts:
  #   - family: Inter
  #     fonts:
